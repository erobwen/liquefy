<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <!--
    Off-screen pages: a stack of whole pages, built and alive, the one in
    front on screen - and the swap between them, both ways. Drawn for a
    dark background, in the theme's colors: shown inline (see the
    Showcase's InlineSvg), its classes read Cascade's CSS variables -
    with the default theme's colors to fall back on.
  -->
  <style>
    .offscreen-base { fill: var(--cascade-chrome-dark, #2c3e50); }
    .offscreen-front-base { fill: var(--cascade-chrome, #34495e); }
    .offscreen-page { fill: url(#offscreen-page-fill); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
    .offscreen-front { fill: url(#offscreen-front-fill); stroke: var(--cascade-accent-light, #e9f2f9); stroke-width: 2; }
    .offscreen-glow { fill: none; stroke: var(--cascade-accent, #2e86c1); stroke-width: 10; filter: url(#offscreen-blur); animation: offscreen-pulse 2.8s ease-in-out infinite; }
    .offscreen-bar { fill: rgba(255, 255, 255, 0.10); }
    .offscreen-dot { fill: rgba(255, 255, 255, 0.45); }
    .offscreen-line { stroke: rgba(255, 255, 255, 0.28); stroke-width: 6; stroke-linecap: round; }
    .offscreen-front-line { stroke: rgba(255, 255, 255, 0.55); stroke-width: 6; stroke-linecap: round; }
    .offscreen-block { fill: rgba(255, 255, 255, 0.14); }
    .offscreen-front-block { fill: var(--cascade-accent, #2e86c1); opacity: 0.85; }
    .offscreen-alive { fill: var(--cascade-accent-light, #e9f2f9); animation: offscreen-blink 2.4s ease-in-out infinite; }
    .offscreen-arc { fill: none; stroke: var(--cascade-accent-light, #e9f2f9); stroke-width: 3; stroke-linecap: round; }
    .offscreen-flow { fill: none; stroke: var(--cascade-accent, #2e86c1); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 16; animation: offscreen-flow 1.2s linear infinite; }
    .offscreen-flow-back { animation-direction: reverse; }
    .offscreen-head { fill: var(--cascade-accent-light, #e9f2f9); }
    .offscreen-label { fill: rgba(255, 255, 255, 0.85); font: 600 14px system-ui, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .offscreen-label-soft { fill: rgba(255, 255, 255, 0.6); }
    .offscreen-along { fill: var(--cascade-accent-light, #e9f2f9); font: 700 13px system-ui, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
    @keyframes offscreen-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
    @keyframes offscreen-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes offscreen-flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) {
      .offscreen-glow, .offscreen-alive, .offscreen-flow { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="offscreen-page-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="offscreen-front-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <filter id="offscreen-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <marker id="offscreen-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="offscreen-head" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <!-- One page: a window's bar, a picture, lines of text. -->
    <g id="offscreen-content">
      <rect class="offscreen-bar" x="0" y="0" width="250" height="26" rx="12" />
      <circle class="offscreen-dot" cx="16" cy="13" r="4" />
      <circle class="offscreen-dot" cx="30" cy="13" r="4" />
      <circle class="offscreen-dot" cx="44" cy="13" r="4" />
      <line class="offscreen-line" x1="100" y1="48" x2="220" y2="48" />
      <line class="offscreen-line" x1="100" y1="64" x2="196" y2="64" />
      <line class="offscreen-line" x1="100" y1="80" x2="226" y2="80" />
      <line class="offscreen-line" x1="16" y1="114" x2="226" y2="114" />
      <line class="offscreen-line" x1="16" y1="130" x2="196" y2="130" />
      <line class="offscreen-line" x1="16" y1="146" x2="212" y2="146" />
    </g>
  </defs>

  <!-- Off screen: built, alive, ready - from the back of the stack forward. -->
  <g transform="translate(276 44)">
    <rect class="offscreen-base" width="250" height="170" rx="12" />
    <rect class="offscreen-page" width="250" height="170" rx="12" />
    <use href="#offscreen-content" />
    <rect class="offscreen-block" x="16" y="40" width="70" height="50" rx="6" />
    <circle class="offscreen-alive" cx="234" cy="13" r="4" style="animation-delay: 0.8s" />
  </g>
  <g transform="translate(226 80)">
    <rect class="offscreen-base" width="250" height="170" rx="12" />
    <rect class="offscreen-page" width="250" height="170" rx="12" />
    <use href="#offscreen-content" />
    <rect class="offscreen-block" x="16" y="40" width="70" height="50" rx="6" />
    <circle class="offscreen-alive" cx="234" cy="13" r="4" style="animation-delay: 0.4s" />
  </g>
  <g transform="translate(176 116)">
    <rect class="offscreen-base" width="250" height="170" rx="12" />
    <rect class="offscreen-page" width="250" height="170" rx="12" />
    <use href="#offscreen-content" />
    <rect class="offscreen-block" x="16" y="40" width="70" height="50" rx="6" />
    <circle class="offscreen-alive" cx="234" cy="13" r="4" />
  </g>

  <!-- On screen. -->
  <g transform="translate(126 156)">
    <rect class="offscreen-glow" width="250" height="170" rx="12" />
    <rect class="offscreen-base offscreen-front-base" width="250" height="170" rx="12" />
    <rect class="offscreen-front" width="250" height="170" rx="12" />
    <rect class="offscreen-bar" x="0" y="0" width="250" height="26" rx="12" />
    <circle class="offscreen-dot" cx="16" cy="13" r="4" />
    <circle class="offscreen-dot" cx="30" cy="13" r="4" />
    <circle class="offscreen-dot" cx="44" cy="13" r="4" />
    <rect class="offscreen-front-block" x="16" y="40" width="70" height="50" rx="6" />
    <line class="offscreen-front-line" x1="100" y1="48" x2="220" y2="48" />
    <line class="offscreen-front-line" x1="100" y1="64" x2="196" y2="64" />
    <line class="offscreen-front-line" x1="100" y1="80" x2="226" y2="80" />
    <line class="offscreen-front-line" x1="16" y1="114" x2="226" y2="114" />
    <line class="offscreen-front-line" x1="16" y1="130" x2="196" y2="130" />
    <line class="offscreen-front-line" x1="16" y1="146" x2="212" y2="146" />
  </g>

  <!-- The swap, both ways: out to the back of the stack, and in from it. -->
  <path id="offscreen-out" class="offscreen-arc" d="M 118 226 C 30 200, 70 24, 266 48" marker-end="url(#offscreen-arrow)" />
  <path class="offscreen-flow" d="M 118 226 C 30 200, 70 24, 266 48" />
  <path class="offscreen-arc" d="M 266 66 C 130 60, 100 170, 118 250" marker-end="url(#offscreen-arrow)" />
  <path class="offscreen-flow offscreen-flow-back" d="M 118 250 C 100 170, 130 60, 266 66" />
  <text class="offscreen-along" dy="-10">
    <textPath href="#offscreen-out" startOffset="18%">instant swap</textPath>
  </text>

  <text class="offscreen-label offscreen-label-soft" x="526" y="28" text-anchor="end">Off screen · alive</text>
  <text class="offscreen-label" x="126" y="350">On screen</text>
</svg>
