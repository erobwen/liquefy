# Publishes to npm: every package whose version isn't on npm yet (see
# scripts/publish-new-versions.mjs) - on a pushed version tag, once every
# package's tests pass. No token or password: npm trusts this workflow
# itself (trusted publishing), and records which commit and workflow built
# each release (provenance).
#
# A release: bump the versions of the packages that changed, commit, then
#   git tag v2.0.0
#   git push origin main v2.0.0
#
# Needs, on npmjs.com, each package's Settings > Trusted publishing set to
# GitHub Actions: user "erobwen", repository "liquefy", workflow "release.yml".
# A package that isn't on npm yet has no settings to set: publish its first
# version by hand (npm login, then npm run build and
# npm publish -w <name>), set its trusted publishing, and every version after
# that is released from here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      # Every package that has a build (its dist/), built from the commit
      # being released - publishing builds them again anyway (prepublishOnly).
      - run: npm run build
      - run: npm test
      - run: node scripts/publish-new-versions.mjs
